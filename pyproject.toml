[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "music-practice"
version = "0.1.0"
description = "MusicXML practice score import, pitch, start detect, and rhythm evaluation"
readme = "README.md"
requires-python = ">=3.10"
# 默认仅契约 + MusicXML 转换（标准库）。音频识别见 optional [audio]。
dependencies = []

[project.optional-dependencies]
# MusicXML → ScoreData（无第三方依赖；显式分组便于文档/CI）
score = []
# 仅音高 detect_pitch / PitchTrackData
pitch = [
    "numpy>=1.24",
    "librosa>=0.10",
    "soundfile>=0.12",
    "scipy>=1.10",
]
# 音高 / 节奏 / recognize()
audio = [
    "music-practice[pitch]",
]
# 开始点识别（start_detect + start_match）
start = [
    "music-practice[audio]",
]
# 开发与回归
dev = [
    "pytest>=7.0",
    "music-practice[all]",
]
# 全量：音高/节奏/recognize + 开始点
all = [
    "music-practice[audio]",
    "music-practice[start]",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
