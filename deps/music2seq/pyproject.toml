[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "music2seq"
version = "0.1.0"
description = "Long-audio template building and tempo-tolerant subsequence matching"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "librosa>=0.10",
    "soundfile>=0.12",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
music2seq = "music2seq.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["music2seq*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".."]
